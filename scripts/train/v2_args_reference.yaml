# REFERENCE ONLY -- ultralytics' own args.yaml from the v2 run, verbatim.
#
# This is the resolved hyperparameter set behind the published v2 result
# (cap4500_yolov8s_v2-2, mAP50 0.7118, 100 epochs in 3.02 h on an RTX 4090).
# scripts/train/check_args_parity.py diffs a new run's args.yaml against this
# file, so a drift in config/training.yaml, in train.py's flag defaults, or in
# ultralytics' own defaults across a version bump shows up as a named key --
# not as an unexplained mAP difference attributed to the labels.
#
# The only keys that are SUPPOSED to differ are data, name, project and save_dir
# (and epochs/fraction for a smoke run). Everything else differing means the arms
# are not measuring what the experiment claims.
#
# Copied from models/current/deployment_kit_v2_cap4500/args.yaml, which is
# gitignored with the rest of the deployment kit. Tracked here because the diff
# target has to survive without the kit or the network volume.
# DO NOT EDIT. It is a record, not a config.
