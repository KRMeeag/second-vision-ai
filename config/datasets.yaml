# ============================================================
# Second Vision AI — Dataset Source Configuration
# ============================================================
#
# Per-source connection, license, and provenance information.
# All acquisition scripts read from this file — no hardcoded
# URLs or project IDs in script bodies.
#
# For Roboflow sources, per D-018r (Local Pull-and-Resolve):
#   - original_url: the public Roboflow Universe URL
#   - pinned_version: the dataset version number to download
#     (set after identifying the best version; null until then)
#   - download_format: yolov8 | coco | voc (format for SDK download)
#   - audit_status: pending | approved | rejected | failed | benched
#     ("failed" = did not pass initial manual look (e.g. bad box
#     geometry) — a relabel candidate, distinct from "rejected" which
#     is final. "benched" = nothing wrong with the source itself, just
#     not the currently-chosen option for strategic/logistics reasons
#     — e.g. a better-fit alternative was found, or the source is
#     temporarily impractical to acquire. Both are "not pursued right
#     now" but for different reasons — keep them distinct so a future
#     read knows whether revisiting it means fixing a problem or just
#     reconsidering a choice.)
#
# Roboflow pools are pulled locally via the Python SDK:
#   project.version(N).download(format)
# and then curated through the same FiftyOne/CVAT pipeline
# as all other sources (Stages 5.3 + 5.5).
#
# Version-selection default (2026-08-08): pin whichever version is
# latest / currently visible when browsing the project on Roboflow's
# site, since that's what quality judgments are actually based on —
# NOT necessarily the version with the most images. See escalator_stairs
# and pothole_vhmow for cases where an older version had more images
# than the latest. Deviate only with a specific reason, noted inline.
# Verified via scripts/acquire/list_roboflow_versions.py.
#
# Schema: HANDOFF v3 + D-018r, DEC-024 (updated 2026-08-06)
# ============================================================

# ========================
# Large-Scale Sources
# ========================

open_images:
  description: >
    Google Open Images V7 — large-scale annotated dataset with
    600+ classes. Primary source for Person, Vehicle, Motorcycle,
    Bicycle, Animals, Chairs, Tables, Trash Bins. Also serves as the
    unified high-volume backbone replacing Objects365 (DEC-024).
  loader: fiftyone_zoo
  fiftyone_dataset_name: "open-images-v7"
  annotation_format: coco_style
  bbox_mode: native_unspecified
  license: "CC BY 4.0"
  download_strategy: >
    Use FiftyOne Zoo dataset loader with classes=[...] filter.
    NEVER download the full ~9M image dataset. Download only
    the needed classes. FiftyOne handles the class-filtered
    download natively — no manual annotation JSON parsing needed.
  native_classes_needed:
    - "Person"
    - "Car"
    - "Bus"
    - "Truck"
    - "Motorcycle"
    - "Bicycle"
    - "Dog"
    - "Cat"
    - "Chair"
    - "Table"
    - "Coffee table"
    - "Waste container"
  notes: >
    Verified 2026-08-08 via fiftyone.utils.openimages.get_classes()
    against the live OI V7 class hierarchy (601 total classes) —
    "Waste container" and "Table" both confirmed exact matches.
    "Coffee table" confirmed to exist and added per DEC-029 (mall/
    lounge deployment scenes). Resolves Blocker #5.

crowdhuman:
  description: >
    CrowdHuman — person detection in crowded scenes.
    Used as secondary (volume_topup) for Person class.
  download_url: "https://huggingface.co/datasets/sshao0516/CrowdHuman"
  annotation_format: odgt
  bbox_mode: native_unspecified
  license: "Research use only (CC-BY-NC-4.0, non-commercial, cite Shao et al. 2018 arXiv:1805.00123)"
  download_strategy: >
    SCRIPTED (DEC-048, reverses DEC-041's manual-only stance for this
    one source — mirror moved to HuggingFace under DEC-048, which is
    public/ungated and has a real SDK, unlike the dead Baidu/Google
    Drive originals). acquire_crowdhuman.py pulls
    CrowdHuman_train01/02/03.zip, CrowdHuman_val.zip,
    annotation_train.odgt, and annotation_val.odgt via
    huggingface_hub.hf_hub_download() to dataset/raw/crowdhuman/.
    Skips CrowdHuman_test.zip — DEC-036 discards every source's
    original split and rebuilds one stratified split at Stage 5.8, so
    a held-out test set from the source would just get pooled in
    anyway. The two annotation files are small enough that they were
    already fetched and verified for real (DEC-048) — the four image
    zips (~14GB total) are not, left for a deliberate full run.
    After download, acquire_crowdhuman.py extracts each zip's Images/
    folder, parses .odgt, extracts vbox field only per DEC-012.
    Discard fbox/hbox from training export. Exclude entries tagged
    'mask' or with extra.ignore == 1 (verified against real data,
    DEC-048 — this note was already correct before that verification).

exdark:
  description: >
    ExDark (Exclusively Dark Image Dataset) — low-light images
    across 12 object classes. Used as cross-cutting low-light
    augmentation layer for 6 classes (DEC-014).
  repo_url: "https://github.com/cs-chan/Exclusively-Dark-Image-Dataset"
  ground_truth_location: "Groundtruth/"
  annotation_format: exdark_native
  bbox_mode: native_unspecified
  license: "Research use"
  total_images: ~7363
  download_strategy: >
    MANUAL DOWNLOAD (DEC-041) — not scripted. A single static archive
    linked from the GitHub README (no direct API), so scripting a
    one-time file-host download isn't worth the maintenance cost.
    Download and extract into dataset/raw/exdark/. Once files are in
    place, acquire_exdark.py uses wraphex/ExDark2Yolo parser logic as
    conversion basis — adapt into shared intermediate schema rather
    than direct-to-YOLO.
  parser_reference: "https://github.com/wraphex/ExDark2Yolo"
  exdark_to_canonical_class_map:
    People: person
    Car: vehicle
    Motorbike: motorcycle
    Bicycle: bicycle
    Dog: animals
    Cat: animals
    Chair: chairs
    Table: tables
    # ExDark classes NOT in our schema (ignored):
    # Boat, Bottle, Bus (covered by Open Images Vehicle)

# ========================
# Dataset Ninja Sources
# ========================

dataset_ninja_pothole_detection:
  description: >
    Pothole detection dataset — 665 images, single class.
    Co-primary source for Potholes, alongside Roboflow pothole-vhmow
    (DEC-034). Combined volume expected to stay under 3500 without
    needing road-damage-detector.
  dataset_name: "pothole-detection"
  download_command: >
    MANUAL DOWNLOAD (DEC-041) — the site's own "Download" button on
    https://datasetninja.com/pothole-detection, not dataset_tools
    (rejected, see history below). Student placed files under
    dataset/raw/dataset_ninja_pothole_detection/ 2026-08-13.
    acquire_datasetninja.py (DEC-049) parses the real Supervisely
    format directly — no SDK, no conversion step.
  native_delivery_format: supervisely
  annotation_format: supervisely
  bbox_mode: absolute_corner_pair
  license: "Check Dataset Ninja listing"
  total_images: 665
  native_classes_needed:
    - "pothole"
  audit_status: approved
  audit_note: >
    Resolved 2026-08-13 (DEC-049) — student placed files manually,
    format verified directly against real data: genuine Supervisely
    project export (ds/img/, ds/ann/*.json, meta.json), confirming
    the 2026-08-08 finding below that it's Supervisely-native, not
    Pascal VOC. Converted in full: 665/665 images, 1739/1740 boxes
    kept (1 degenerate zero-width box correctly dropped as invalid).
    Considered and rejected using the supervisely/dataset_tools SDK
    for the conversion (as originally planned) — parsing the format
    directly took ~20 lines and avoided re-hitting the friction noted
    below, since the schema itself (corner-pair rectangles, in-JSON
    image dimensions) is simple enough not to need it.

    History: originally blocked 2026-08-08 — dataset-tools resolved
    to a Dropbox-hosted link that returned "Link Temporarily Disabled"
    (Dropbox free-tier rate limit), and installing dataset-tools/
    supervisely required a system-level libmagic dependency and
    downgraded xmltodict below fiftyone's stated floor. Manual
    download via the site's own button (DEC-041) avoided the SDK
    entirely, and the rate limit had cleared by the time the student
    retried.

dataset_ninja_road_damage_detector:
  description: >
    Road Damage Detector — originally a deprioritized (DEC-034) fallback,
    mixing potholes with crack/repair classes requiring filtering.
    Activated 2026-08-21 (DEC-086) — student's call, needed as a real
    fallback now that Potholes' active total would otherwise sit below
    DEC-042's 1,500 floor (flagged as an open ambiguity in DEC-085).
    The full academic RDD2022 dataset is 47,420 images / 7 classes,
    but the Dataset Ninja-hosted export actually placed under
    dataset/raw/ (2026-08-13) is a smaller curated subset — 3,321
    images, 4 classes (alligator/lateral/longitudinal crack, pothole).
    Verified directly (meta.json + file count), not assumed — this
    project's total_images/total_classes fields below describe that
    subset, not the full RDD2022 figure.
  dataset_name: "road-damage-detector"
  annotation_format: supervisely
  bbox_mode: absolute_corner_pair
  license: "Check Dataset Ninja listing"
  total_images: 3321
  total_classes: 4
  native_classes_needed:
    - "pothole"
  audit_status: approved  # 2026-08-21 (DEC-086) — matches dataset_ninja_pothole_detection's field, makes the previously-implicit "already converted, load-bearing" state explicit
  audit_note: >
    Activated 2026-08-21 (DEC-086). Format claim corrected — the
    "unverified, not attempted yet" note below was stale: real
    conversion already happened 2026-08-13 via
    scripts/acquire/acquire_datasetninja.py (its SOURCES dict has
    always included this project unconditionally, filtered to
    "pothole" only via class_filter, alligator/lateral/longitudinal
    crack correctly dropped as boxes_dropped_non_canonical). Verified
    directly against the real converted output: 1,331 images / 1,331
    labels in dataset/processed/dataset_ninja_road_damage_detector/,
    every box canonical (no non-pothole content slipped through).
    This project had no audit_status field at all before this entry —
    the pipeline's cap/merge stage (see DEC-086) doesn't gate on it
    for any source type, so its absence had zero functional effect,
    but it left this source's "is this actually in the pool" status
    genuinely ambiguous to a reader. Set explicitly now, matching its
    sibling dataset_ninja_pothole_detection.
  notes: >
    Filter to "pothole" class only, discard crack/repair classes
    during conversion — already implemented in
    scripts/acquire/acquire_datasetninja.py, not a future TODO (see
    audit_note above, which corrects this file's own previously-stale
    claim that conversion was "not attempted yet").

# ========================
# Roboflow Sources
# ========================
# Per D-018r: pull locally via pinned SDK version.
# Roboflow pools flow through the same curation pipeline
# as large-scale sources (Stages 5.3 + 5.5).

roboflow_projects:

  # --- Stairs (4 sources) ---
  stairs_lusiz:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/stairs-n9kkx/stairs-lusiz"
    pinned_version: 1  # only version available (4089 images), 2026-08-08
    download_format: yolov8
    audit_status: failed
    audit_note: >
      Boxes wrap tightly around the staircase silhouette rather than
      sitting as a clean axis-aligned rectangle — looks polygon-derived,
      not a true bbox. Not discarded — relabel candidate if volume is
      worth recovering. See docs/preprocessing.md. DEC-031.

  stairs_hsatv:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/abeera-munir-v9edc/stairs-hsatv"
    pinned_version: 1  # only version available (559 images), 2026-08-08
    download_format: yolov8
    audit_status: failed
    audit_note: >
      Same box-shape issue as stairs_lusiz — see docs/preprocessing.md.
      DEC-031.

  # Priority: stairs_i2yia and escalator_stairs are the two Stairs
  # sources still pending and are prioritized over relabeling the
  # two failed sources above (DEC-031).
  stairs_i2yia:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/tom-lai-8bp7n/stairs-i2yia"
    pinned_version: 3  # only version returned (1567 images) — v1/v2 apparently retired by owner, 2026-08-08
    download_format: yolov8
    audit_status: failed
    audit_note: >
      2026-08-20: failed on direct visual review (student, full pass) —
      boxes are wrong, not just shape-imperfect, across the reviewed
      pool. Confirmed independently on 3 non-flagged samples pulled for
      this entry: one box sits on a floor rug below the actual
      staircase (misses the stairs structure entirely), another is a
      thin vertical sliver on the image's far-left edge nowhere near
      the real staircase visible in the center of frame. This is a
      stronger finding than DEC-057's original shape-outlier heuristic
      (178/1559 flagged) suggested — the heuristic only flags
      statistical outliers *within this source's own distribution*, so
      a source that's uniformly off in a similar way across most of its
      images would show few outliers by construction, without that
      meaning the un-flagged majority is fine. Superseded by
      `stair_gaptw` as the primary Stairs source (DEC-082). Excluded
      from `merge.py`/`cap_per_class.py` going forward — same posture
      as `stairs_lusiz`/`stairs_hsatv` (DEC-031).

  escalator_stairs:
    canonical_classes: [stairs, escalator]
    original_url: "https://universe.roboflow.com/escalatorstairsdetection/escalator-stairs"
    pinned_version: 3  # latest, 8685 images — matches what the student visually reviewed in
    # the Roboflow GUI. v2 (34740 images) is oddly ~4x larger than both v1 and v3; not used
    # since it doesn't match the visually-inspected current project state. 2026-08-08.
    download_format: yolov8
    audit_status: failed
    native_class_filter:
      stairs: ["downstair", "upstair"]
      escalator: "Escalator"
    audit_note: >
      2026-08-13: real exported class names are downstair/upstair/
      Escalator, not stairs/escalator as originally configured (filter
      keys didn't match anything real — verified against actual
      data.yaml before writing openimages/yolo converters, DEC-053).
      Fixed to match real names.

      2026-08-20: failed on direct visual review (student, full pass) —
      duplicate/near-duplicate images and faulty boxes throughout.
      Confirmed independently, and confirmed this is NOT
      escalator-specific: 2 of 3 sampled Stairs-only-labeled images
      (native class filtered to "stairs") were low-resolution (227x227),
      heavily grainy, monochrome crops; a third closely matched an
      already-checked full-size image (same stairwell, same rag-on-step,
      same shadow pattern) closely enough to read as a near-duplicate.
      Both native classes from this source are excluded going forward,
      not just its escalator content — this source contributed to Stairs
      too (DEC-042's floor/ratio math for Stairs must be recomputed
      without it; see DEC-082). No replacement identified for this
      source's Escalator contribution as of DEC-082 — Escalator's slot
      in `classes.yaml` is reserved, not renumbered, pending either a
      new Escalator source or a decision to retire the class (DEC-082).

  stair_gaptw:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/school-4awgw/stair-gaptw"
    pinned_version: 1  # only version (1564 images), SDK-checked 2026-08-20
    download_format: yolov8
    audit_status: pending
    license: "Public Domain"  # from the real downloaded data.yaml's roboflow.license field, 2026-08-20
    audit_note: >
      Student-sourced 2026-08-20 to replace stairs_i2yia (DEC-082, both
      stairs_i2yia and escalator_stairs failed visual review). SDK-
      checked before adding, same discipline as every prior source: real
      class list is a single class, "stair" (1,766 instances project-
      wide) — no filtering needed, unambiguous match to the canonical
      class. Pulled 1,564 images (DEC-082).

  # --- Doors ---
  cv_project_hovyc:
    canonical_class: doors
    original_url: "https://universe.roboflow.com/testspace-xwkgk/cv-project-hovyc"
    pinned_version: 2  # latest of 2 (1341 images), 2026-08-08
    download_format: yolov8
    audit_status: pending
    native_class_filter: "Door"
    audit_note: >
      2026-08-13: real export has 5 classes (Door, Exit down, Exit left,
      Exit right, Exit up) — only Door has a canonical slot. The other
      4 are navigational signage with no canonical class; dropped, same
      "drop what doesn't map" pattern as every other source (DEC-053).

      Reviewed in fiftyone_review_processed.ipynb (71 excluded, 277
      predictions promoted) — write-back promoted over the real `labels/`
      2026-08-21 (DEC-087). NOTE: this is no longer a Doors-only source —
      the review added real, visually-verified boxes for other canonical
      classes visibly present in the same door/entrance photos (person
      103, stairs 77, chairs 38, vehicle 37, pole 32, trash_bins 20,
      bicycle 17, tables 11, animals 5, pedestrian_lane 4, motorcycle 4
      images, per a direct post-promotion recount). Spot-checked 2 samples
      (a Pole+Pedestrian Lane image, a Stairs image) — both correctly,
      tightly boxed. `canonical_class: doors` above only reflects this
      source's original Stage 5.2 conversion mapping, not its current
      full content — the cap/merge stage reads actual box content, not
      this field, so this is a documentation-accuracy note, not a
      functional issue.

  door_detection_zqt59:
    canonical_class: doors
    original_url: "https://universe.roboflow.com/nathaly-espinoza/door-detection-zqt59"
    pinned_version: 3  # latest, 5173 images (up from v2's 4747, v1's 1978)
    download_format: yolov8
    audit_status: pending
    native_class_filter: "door"
    license: "CC BY 4.0"  # confirmed by student 2026-08-18 (DEC-073)
    audit_note: >
      Identified 2026-08-18 (student-sourced) to address Doors being the
      new post-eyecue bottleneck (1,337 images, DEC-069). Checked via
      Roboflow SDK before adding: real class list is 4 classes — door
      (1908 instances), knob (376), hinged (1739), lever (1239). Only
      "door" is an unambiguous canonical match; knob/lever read as
      door-hardware (handle) sub-parts, not full-door boxes, so dropped
      same as cv_project_hovyc's Exit-signage classes. "hinged" confirmed
      by the student 2026-08-18 (DEC-073) to be door-hinge hardware, not
      an additional door-type label — correctly dropped by
      native_class_filter: "door" alongside knob/lever. Every hinged-only
      instance still belongs to an image that also contains a real "door"
      box (hinges photographed without their door don't occur in this
      source), so no image was lost to this filtering — only the hinge
      boxes themselves were dropped, same "drop what doesn't map" pattern
      as every other multi-class source (DEC-053). No further action
      needed on this class. License confirmed CC BY 4.0 by the student
      2026-08-18 (DEC-073) — SDK exposed no license field, so this
      overrides the earlier "could not verify" note.

  # --- Elevator (2 sources, 1 flagged for audit) ---
  elevator_awvus:
    canonical_class: elevator
    original_url: "https://universe.roboflow.com/detection-3h20r/elevator-awvus"
    pinned_version: 2  # latest of 2 (1778 images), 2026-08-08
    download_format: yolov8
    audit_status: pending

  elevator_status_s4lrk:
    canonical_class: elevator
    original_url: "https://universe.roboflow.com/rightly-ai-huxry/elevator-status-s4lrk"
    pinned_version: 1  # only version available (3656 images), 2026-08-08
    download_format: yolov8
    audit_status: failed
    audit_note: >
      Mini-audit 2026-08-08: primarily close-up elevator shots.
      Multiple state-related labels exist but can all collapse into
      the single canonical "elevator" class — this project doesn't
      need state discrimination. Same box-shape concern as Stairs
      applies (boxes cling to object shape rather than a clean
      axis-aligned rectangle) — see docs/preprocessing.md. DEC-031.

      2026-08-20: the "genuine usable subset" framing above does not
      hold up — failed on direct visual review (student, full pass) and
      independently confirmed on 3 non-cherry-picked samples (1 flagged,
      2 random) pulled for this entry: all 3 show a large corrupted
      black polygon void eaten into the actual source image itself (not
      a rendering artifact — present in the raw jpg), with the box
      sitting mostly on that void instead of the real door/panel. One
      sample visibly carries an "alamy" stock-photo watermark. This is
      source-image corruption, not a labeling-style issue — not
      salvageable by nudging boxes. Superseded by `elevator_awvus`
      (confirmed clean, 3/3 independently-checked samples) as the sole
      active Elevator source, plus `elevator_status_0iq4p` (DEC-082).
      Excluded from `merge.py`/`cap_per_class.py` going forward.

  elevator_status_0iq4p:
    canonical_classes: [elevator, person]
    original_url: "https://universe.roboflow.com/elevator-0iq4p/elevator-status"
    pinned_version: 2  # latest of 2, both 1464 images (no anomaly), SDK-checked 2026-08-20
    download_format: yolov8
    audit_status: pending
    license: "CC BY 4.0"  # from the real downloaded data.yaml's roboflow.license field, 2026-08-20
    native_class_filter:
      elevator: ["Open Elevator", "Closed Elevator", "-Nobody was in the elevator"]
      person: "People are in the elevator."
    audit_note: >
      Student-sourced 2026-08-20, distinct Roboflow project from the
      failed elevator_status_s4lrk (different workspace: elevator-0iq4p
      vs rightly-ai-huxry — verified not a duplicate/mirror). SDK-checked
      before adding: SDK's `project.classes` reported a 4th class name
      with a stray leading combining character; the real downloaded
      data.yaml instead has a plain ASCII hyphen prefix
      ("-Nobody was in the elevator") — an SDK-vs-real-export mismatch
      caught by checking the actual file before trusting the convert
      run, same DEC-053 discipline that already caught real mismatches
      on escalator_stairs/me5_u6rvg. All 4 native classes are
      classification-style labels, not a plain "Elevator" box, the same
      pattern DEC-031/DEC-057 flagged in the now-failed
      elevator_status_s4lrk — explicit student decision (not a script
      default) to proceed anyway, splitting "People are in the
      elevator." into canonical Person rather than Elevator (the other
      3 state labels stay canonical Elevator), since that label likely
      marks people in-frame rather than the elevator itself. Geometric
      accuracy of this remap (does the box tightly bound the person, or
      the whole elevator interior like its sibling labels?) is
      explicitly NOT verified here — student will visually inspect
      post-merge (docs/OPEN_QUESTIONS.md).

  # --- Pedestrian Lane ---
  pedestrian_and_animal_crossing:
    canonical_class: pedestrian_lane
    original_url: "https://universe.roboflow.com/kenth/pedestrian-and-animal-crossing-vcjuo"
    forked_from_url: "https://universe.roboflow.com/anomaly-road-crossing-detection/pedestrian-and-animal-crossing"
    pinned_version: 1  # forked + regenerated 2026-08-13 (DEC-053) — see audit_note
    download_format: yolov8
    audit_status: benched
    native_class_filter: "------------------------------"
    audit_note: >
      2026-08-13 (DEC-053): the original project's only generated
      version (v1, 1071 images) exported just one class, "people" —
      pedestrians, not the crosswalk/lane marking this canonical class
      needs. The real marking class existed in the source project's raw
      uploads but was never included in any generated version; its live
      API name was "==============================" (2,610 instances,
      almost certainly a garbage name from a mislabeled annotation
      batch). Forked the project into the student's own workspace
      (kenth/pedestrian-and-animal-crossing-vcjuo) and generated a new
      version with no augmentation/preprocessing, which pulled in all 4
      raw classes — 3,536 images. Roboflow's export sanitizes special
      characters for YOLO format, so the real filterable name changed
      to "------------------------------" (30 dashes) — verified
      directly against the downloaded data.yaml, not assumed to match
      the API's original name. original_url now points at the forked
      project so future acquire_roboflow.py reruns reproduce this, not
      the original narrow export; true source project recorded
      separately in forked_from_url for attribution.

      Benched 2026-08-20 (DEC-083) — student substituted
      ajsh-yai1y/wtf-dwvgm as the main Pedestrian Lane source, plus a
      crosswalk supplement from thesis-test-dataset/revised-pedestrian-obstacle.
      Not confirmed defective this session — benched for the new
      sources' preference, same benched-not-failed distinction as
      DEC-037.

  wtf_dwvgm:
    canonical_class: pedestrian_lane
    original_url: "https://universe.roboflow.com/ajsh-yai1y/wtf-dwvgm"
    pinned_version: 2  # latest; v1 (3,392 img) is larger than v2 (1,332 img) -- same
    # "latest isn't largest" pattern seen before (escalator_stairs, pothole_vhmow) --
    # defaulting to latest per DEC-036's stated convention, flag if v1 is preferred instead.
    download_format: yolov8
    audit_status: pending
    license: "MIT"  # from the real downloaded data.yaml's roboflow.license field, 2026-08-20
    native_class_filter:
      pedestrian_lane: ["crosswalk", "Crosswalks"]
    audit_note: >
      Student-sourced 2026-08-20 (DEC-083) — "Main Pedestrian Lane
      Dataset," the primary replacement for pedestrian_and_animal_crossing.
      SDK-checked before adding: real class list is "crosswalk"
      (1,463 instances), "Crosswalks" (130 instances — a differently
      cased/pluralized duplicate label within the same project, both
      mapped to canonical Pedestrian Lane), and "object" (4 instances,
      dropped as negligible/junk).

      Real bug caught 2026-08-20: first attempt configured this filter
      as a bare list (`["crosswalk", "Crosswalks"]`), which
      yolo_to_intermediate.py's resolve_class_mapping() doesn't
