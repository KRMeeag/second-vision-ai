    canonical_class: vehicle
    original_url: "https://universe.roboflow.com/lozanomartirezquimno-thesis/jeep-hozhs"
    pinned_version: 3  # latest — all 3 versions have identical 1988 images; per-version split
    # differences (v3 has almost no test set) don't matter since source splits are discarded
    # and rebuilt at Stage 5.8 regardless (DEC-036). 2026-08-08.
    download_format: yolov8
    audit_status: benched
    audit_note: >
      Benched 2026-08-08 (DEC-037) in favor of me5_u6rvg — nothing
      wrong with this source itself, just not currently the chosen
      one. Not deleted; reconsider if me5_u6rvg's actual Vehicle-only
