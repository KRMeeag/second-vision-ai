    download_format: yolov8
    audit_status: failed
    audit_note: >
      Boxes wrap tightly around the staircase silhouette rather than
      sitting as a clean axis-aligned rectangle — looks polygon-derived,
      not a true bbox. Not discarded — relabel candidate if volume is
      worth recovering. See docs/preprocessing.md. DEC-031.

  stairs_hsatv:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/abeera-munir-v9edc/stairs-hsatv"
    pinned_version: 1  # only version available (559 images), 2026-08-08
    download_format: yolov8
    audit_status: failed
    audit_note: >
      Same box-shape issue as stairs_lusiz — see docs/preprocessing.md.
      DEC-031.

  # Priority: stairs_i2yia and escalator_stairs are the two Stairs
  # sources still pending and are prioritized over relabeling the
  # two failed sources above (DEC-031).
  stairs_i2yia:
    canonical_class: stairs
    original_url: "https://universe.roboflow.com/tom-lai-8bp7n/stairs-i2yia"
    pinned_version: 3  # only version returned (1567 images) — v1/v2 apparently retired by owner, 2026-08-08
    download_format: yolov8
    audit_status: pending

  escalator_stairs:
    canonical_classes: [stairs, escalator]
    original_url: "https://universe.roboflow.com/escalatorstairsdetection/escalator-stairs"
    pinned_version: 3  # latest, 8685 images — matches what the student visually reviewed in
    # the Roboflow GUI. v2 (34740 images) is oddly ~4x larger than both v1 and v3; not used
    # since it doesn't match the visually-inspected current project state. 2026-08-08.
    download_format: yolov8
    audit_status: pending
    native_class_filter:
      stairs: ["downstair", "upstair"]
      escalator: "Escalator"
    audit_note: >
      2026-08-13: real exported class names are downstair/upstair/
      Escalator, not stairs/escalator as originally configured (filter
      keys didn't match anything real — verified against actual
      data.yaml before writing openimages/yolo converters, DEC-053).
      Fixed to match real names.

  # --- Doors ---
  cv_project_hovyc:
    canonical_class: doors
    original_url: "https://universe.roboflow.com/testspace-xwkgk/cv-project-hovyc"
    pinned_version: 2  # latest of 2 (1341 images), 2026-08-08
    download_format: yolov8
    audit_status: pending
    native_class_filter: "Door"
    audit_note: >
      2026-08-13: real export has 5 classes (Door, Exit down, Exit left,
      Exit right, Exit up) — only Door has a canonical slot. The other
      4 are navigational signage with no canonical class; dropped, same
      "drop what doesn't map" pattern as every other source (DEC-053).

  door_detection_zqt59:
    canonical_class: doors
    original_url: "https://universe.roboflow.com/nathaly-espinoza/door-detection-zqt59"
    pinned_version: 3  # latest, 5173 images (up from v2's 4747, v1's 1978)
    download_format: yolov8
    audit_status: pending
    native_class_filter: "door"
    audit_note: >
      Identified 2026-08-18 (student-sourced) to address Doors being the
      new post-eyecue bottleneck (1,337 images, DEC-069). Checked via
      Roboflow SDK before adding: real class list is 4 classes — door
      (1908 instances), knob (376), hinged (1739), lever (1239). Only
      "door" is an unambiguous canonical match; knob/lever read as
      door-hardware (handle) sub-parts, not full-door boxes, so dropped
      same as cv_project_hovyc's Exit-signage classes. "hinged" is
      genuinely ambiguous from class name alone (could be a door-type
      label covering more real door instances, or a hardware sub-part
      like the other two) — filtered out for this pull pending the
      student's own visual check; a 1739-instance class is large enough
      to be worth revisiting if "door" alone doesn't close the gap.
      License could not be verified via SDK (no license field exposed,
      WebFetch on the project page blocked) — student should confirm on
      the project page directly, same caveat as trashcan_detection_pihfn.

  # --- Elevator (2 sources, 1 flagged for audit) ---
  elevator_awvus:
    canonical_class: elevator
    original_url: "https://universe.roboflow.com/detection-3h20r/elevator-awvus"
    pinned_version: 2  # latest of 2 (1778 images), 2026-08-08
    download_format: yolov8
    audit_status: pending

  elevator_status_s4lrk:
    canonical_class: elevator
    original_url: "https://universe.roboflow.com/rightly-ai-huxry/elevator-status-s4lrk"
    pinned_version: 1  # only version available (3656 images), 2026-08-08
    download_format: yolov8
    audit_status: pending
    audit_note: >
      Mini-audit 2026-08-08: primarily close-up elevator shots.
      Multiple state-related labels exist but can all collapse into
      the single canonical "elevator" class — this project doesn't
      need state discrimination. Does contain genuine detection-style
      samples (people inside elevators with real bounding boxes), not
      purely image-level classification as originally suspected. Same
      box-shape concern as Stairs applies (boxes cling to object shape
      rather than a clean axis-aligned rectangle) — see
      docs/preprocessing.md. Still pending full Stage 5.3 audit to
      isolate the usable detection-style subset. DEC-031.

  # --- Pedestrian Lane ---
  pedestrian_and_animal_crossing:
    canonical_class: pedestrian_lane
    original_url: "https://universe.roboflow.com/kenth/pedestrian-and-animal-crossing-vcjuo"
    forked_from_url: "https://universe.roboflow.com/anomaly-road-crossing-detection/pedestrian-and-animal-crossing"
    pinned_version: 1  # forked + regenerated 2026-08-13 (DEC-053) — see audit_note
    download_format: yolov8
    audit_status: pending
    native_class_filter: "------------------------------"
    audit_note: >
      2026-08-13 (DEC-053): the original project's only generated
      version (v1, 1071 images) exported just one class, "people" —
      pedestrians, not the crosswalk/lane marking this canonical class
      needs. The real marking class existed in the source project's raw
      uploads but was never included in any generated version; its live
      API name was "==============================" (2,610 instances,
      almost certainly a garbage name from a mislabeled annotation
      batch). Forked the project into the student's own workspace
      (kenth/pedestrian-and-animal-crossing-vcjuo) and generated a new
      version with no augmentation/preprocessing, which pulled in all 4
      raw classes — 3,536 images. Roboflow's export sanitizes special
      characters for YOLO format, so the real filterable name changed
      to "------------------------------" (30 dashes) — verified
      directly against the downloaded data.yaml, not assumed to match
      the API's original name. original_url now points at the forked
      project so future acquire_roboflow.py reruns reproduce this, not
      the original narrow export; true source project recorded
      separately in forked_from_url for attribution.

  # --- Tricycle (2 sources) ---
  augmented_tricycle:
    canonical_class: tricycle
    original_url: "https://universe.roboflow.com/traffico-augmented/augmented-tricycle"
    pinned_version: 1  # only version available (3021 images), 2026-08-08
    download_format: yolov8
    audit_status: pending
    audit_note: >
      Needs a duplicate-image pass at Stage 5.6 (FiftyOne Brain,
      DEC-025). Missing Person annotations for images where people
      are visibly present (e.g. the tricycle driver) — see the
      model-assisted pre-labeling procedure in docs/preprocessing.md.

  traffico_y1:
    canonical_classes: [tricycle, vehicle, motorcycle]
    original_url: "https://universe.roboflow.com/yoloffico/traffico-y1"
    pinned_version: null
    download_format: yolov8
    audit_status: benched
    native_class_filter:
      vehicle: "Jeepney"
      motorcycle: "Motorcycle"
      tricycle: ["Tricycle", "tricycle"]
    audit_note: >
      Full class list obtained 2026-08-08 (DEC-032): Jeepney,
      Motorcycle, null, Tricycle, tricycle. Mapped as above — the
      "Tricycle"/"tricycle" case-variant pair both map to the
      canonical tricycle class. The "null" entry was left unresolved
      (likely an empty/background class artifact, not a real label).

      BLOCKED 2026-08-08: list_roboflow_versions.py returned zero
      generated versions for this project via the API, despite the
      class list above having been obtained by browsing it directly —
      likely nobody had clicked "Generate" on Roboflow's side.

      Formally benched 2026-08-17/18 (student's explicit call, same
      pattern as jeep_hozhs/DEC-037): me5_u6rvg was already reactivated
      to cover this gap and turned out to carry the same Jeepney/
      Motorcycle/Tricycle content plus real Van/Truck/Ambulance data
      too (DEC-053) — nothing traffico_y1 would add is missing.
      Nothing wrong with the source itself, just redundant now. Not
      deleted; reconsider only if Roboflow's side ever generates a
      version AND me5_u6rvg's real yield proves insufficient.

  # --- Vehicle + Motorcycle secondary (Jeepney/Ambulance/Cars/Motorcycle) ---
  me5_u6rvg:
    canonical_classes: [vehicle, motorcycle, tricycle]
    original_url: "https://universe.roboflow.com/machine-exercise-5/me5-u6rvg"
    pinned_version: 1  # only version available (7243 images total, across all classes below)
    download_format: yolov8
    audit_status: pending
    # The exported data.yaml's `names` are placeholder digit strings
    # ("0".."7"), not real class names — a real export bug on Roboflow's
    # side (verified 2026-08-13). Real names recovered via the Roboflow
    # API (Project.classes, live class-instance counts) and matched to
    # indices by exact instance count: index 2=Motorcycle(709),
    # 3=Tricycle(610), 4=Van(872), 5=Ambulance(254), 6=Cars(722),
    # 7=Truck(974) — unique exact matches, high confidence. Indices 0+1
    # (3244+1149=4393) are both very likely "Jeepney" (API total 4394,
    # off by 1 — plausible version/split discrepancy, not treated as a
    # blocker). Student explicitly approved using the full recovered
    # mapping (DEC-053) rather than staying conservative or skipping.
    native_class_index_override:
      "0": "Jeepney"
      "1": "Jeepney"
      "2": "Motorcycle"
      "3": "Tricycle"
      "4": "Van"
      "5": "Ambulance"
      "6": "Cars"
      "7": "Truck"
    native_class_filter:
      vehicle: ["Ambulance", "Cars", "Jeepney", "Van", "Truck"]
      motorcycle: "Motorcycle"
      tricycle: "Tricycle"
    audit_note: >
      Reactivated 2026-08-08 (DEC-037, supersedes the relevant part of
      DEC-032) — traffico-y1 remains blocked (zero generated versions)
      and forking it was declined (uncertainty over Roboflow credit
      consumption), so this replaces jeep_hozhs as Vehicle's active
      secondary. 2026-08-13 (DEC-053): real full class list recovered
      via API is Ambulance/Cars/Jeepney/Van/Truck/Motorcycle/Tricycle
      (7 named classes across 8 indices, Jeepney split across 2) — not
      the originally-assumed 5. Tricycle presence is a genuine bonus
      given the class's Philippine-context relevance; now mapped in.

