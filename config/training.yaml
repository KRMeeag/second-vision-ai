# ============================================================
# Second Vision AI — YOLOv8s Training Configuration
# ============================================================
#
# Baseline hyperparameters for the eventual notebooks/train_yolov8.ipynb
# (ultralytics.YOLO.train(cfg=...)). This is a BASELINE config only —
# augmentation strategy and further tuning are explicitly deferred to
# PLAN.md Phase 6 (Iteration & Optimization), not decided yet.
#
# DO NOT add augmentation overrides (mosaic, mixup, hsv_*, degrees,
# translate, scale, shear, flipud/fliplr, copy_paste, etc.) here without
# a DECISIONS.md entry — leaving them unset means Ultralytics' own
# defaults apply, which is the correct behavior for a baseline run.
#
# Schema: PLAN.md Phase 3 "Baseline Configuration" + DEC-022
# ============================================================

# --- Data ---
# Generated by scripts/build/generate_yaml.py (Stage 5.9). This path
# does not exist yet — the full dataset pipeline (Stages 5.1-5.9) must
# run first. Update this if generate_yaml.py ends up writing elsewhere.
data: dataset/final/data.yaml

# --- Model ---
# YOLOv8s (small) — upgraded from YOLOv8n per DEC-022. Starts from
# COCO-pretrained weights (transfer learning), per DEC-003's rationale.
model: yolov8s.pt

# --- Core training loop ---
epochs: 100    # PLAN.md Phase 3 baseline
patience: 20   # Early stopping: halt if val metrics don't improve for 20
               # epochs. Not a DECISIONS.md entry yet — a conventional
               # starting point (~20% of epochs). Revisit in Phase 6 if
               # baseline runs stop too early or too late.
imgsz: 640     # Standard, Hailo-compatible (README.md, PLAN.md)
batch: 16      # PLAN.md baseline — lower if you hit GPU out-of-memory,
               # raise if GPU memory allows faster training.

# --- Reproducibility ---
seed: 42   # Matches the seed convention already used in explore_dataset.py.

# --- Run identification ---
# Ultralytics writes output to runs/detect/<name>/ (gitignored — see
# .gitignore's "Training outputs" section). Promote the final chosen
# weights into models/weights/ once selected; runs/ is disposable
# experiment scratch space, not the tracked model location.
name: second_vision_yolov8s_baseline

# --- Device ---
# Intentionally left unset. GPU/CPU availability varies by environment
# (local machine vs. Colab vs. a cloud GPU) — pass device explicitly at
# the call site instead of hardcoding it into a shared config file.
