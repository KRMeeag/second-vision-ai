# ============================================================
# Second Vision AI — Canonical Class Configuration
# ============================================================
#
# This is the AUTHORITATIVE class list and source mapping for
# the project. All dataset converters, acquisition scripts,
# training configs, and evaluation scripts must reference this
# file.
#
# DO NOT modify without updating DECISIONS.md.
# Supersedes DEC-002 via DEC-015, DEC-021, DEC-038.
#
# Note: Hailo runtime injects a Background class at index 0,
# shifting all IDs by +1 at deployment time.
#
# Schema: HANDOFF v3 + DEC-018r, DEC-024, DEC-038 (updated 2026-08-08)
# ============================================================

# --- Annotation Policy ---
annotation_policy:
  canonical_bbox_mode: visible
  description: >
    Boxes must tightly enclose the visible extent of each object.
    Hidden object extent must not be estimated. See DEC-012.

# --- Number of classes ---
nc: 16

# --- Class names (0-indexed for YOLO training) ---
names:
  0: Person
  1: Vehicle
  2: Motorcycle
  3: Pole
  4: Animals
  5: Stairs
  6: Shelf
  7: Doors
  8: Chairs
  9: Tables
  10: Tricycle
  11: Potholes
  12: Trash Bins
  13: Elevator
  14: Pedestrian Lane
  15: Bicycle

# --- Hailo runtime mapping (after background class injection) ---
# Reference only — used when generating custom label JSON
hailo_runtime_names:
  0: Background
  1: Person
  2: Vehicle
  3: Motorcycle
  4: Pole
  5: Animals
  6: Stairs
  7: Shelf
  8: Doors
  9: Chairs
  10: Tables
  11: Tricycle
  12: Potholes
  13: Trash Bins
  14: Elevator
  15: Pedestrian Lane
  16: Bicycle

# --- Per-Class Source Configuration ---
# Defines primary, secondary, and low-light augmentation providers
# for each class, along with caps and fill-order semantics.
#
# Fields:
#   primary / primary_providers:    main data source(s)
#   secondary / secondary_providers: supplemental source(s)
#   lowlight_augment:               ExDark cross-cutting layer (6 eligible classes)
#   cap:                            max images per class — hard cap 4500 for
#                                    every class per DEC-042 (3:1 ratio off a
#                                    1500 floor); no class may be uncapped
#   role:                           diversity | volume_topup
#   native_class_filter:            source-side class name(s) to extract
#   audit_note:                     blockers resolved during Stage 5.3/5.5
#   status:                         confirmed | possible
#   guaranteed_floor:               if true, ExDark images reserved before primary fill
#
# Roboflow sources per D-018r (Local Pull-and-Resolve):
#   Downloaded locally via pinned SDK version, then curated through
#   the same FiftyOne/CVAT pipeline as large-scale sources.
#   Native class remapping happens during conversion (Stage 5.2).

classes:
  person:
    id: 0
    primary:
      source: open_images
      native_class: "Person"
    secondary:
      source: crowdhuman
      box_type: vbox
      role: volume_topup
    lowlight_augment:
      source: exdark
      native_class: "People"
      guaranteed_floor: true
    cap: 4500

  vehicle:
    id: 1
    primary:
      source: open_images
      native_class: ["Car", "Bus", "Truck"]
    secondary_providers:
      - source: roboflow
        project: "machine-exercise-5/me5-u6rvg"
        native_class_filter: ["Ambulance", "Cars", "Jeepney"]
        note: >
          Active as of 2026-08-08 (DEC-037) — replaces jeep_hozhs.
          Multi-class source (see datasets.yaml for full mapping incl.
          motorcycle). Jeepney slice is a Philippine-specific edge
          case, same DEC-033 treatment as before (not volume-discounted).
          Benched 2026-08-21 (DEC-087) — never went through full
          `fiftyone_review_processed.ipynb` review (still `[x]`,
          unreviewed, at review-checklist time); student's call to drop
          it from Vehicle/Motorcycle/Tricycle rather than review it.
      - source: roboflow
        project: "lozanomartirezquimno-thesis/jeep-hozhs"
        note: "Benched 2026-08-08 (DEC-037) in favor of me5_u6rvg — see datasets.yaml."
      - source: roboflow
        project: "yoloffico/traffico-y1"
        native_class_filter: "Jeepney"
        note: >
          Class list resolved 2026-08-08 (DEC-032). Jeepney is a
          Philippine-specific vehicle type with no Open Images/COCO
          analogue — see DEC-033 for why its volume isn't discounted
          the way ordinary Vehicle imagery is.
      - source: roboflow
        project: "thesis-test-dataset/revised-pedestrian-obstacle"
        native_class_filter: "vehicle"
        role: diversity
        note: >
          Added 2026-08-20 (DEC-083) — "General Filipino Outside
          Dataset." Its native "vehicle" label has motorcycles mixed
          in with no sub-filter to split them. Student's 2026-08-21
          instruction (DEC-087): these need active cleaning during the
          `fiftyone_review_processed.ipynb` pass, not just flagging —
          no automated sub-filter exists to separate them, this is a
          visual-review task.
      - source: roboflow
        project: "dlsud-vehicle-classification-thesis/dlsu-d-vehicle-type-detection"
        native_class_filter: ["Public Utility Jeepney", "Medium Goods Vehicle", "Light Goods Vehicle", "Large Bus", "Small Bus", "Van"]
        role: diversity
        note: >
          Added 2026-08-20 (DEC-083) — "Filipino Related Road
          Vehicles." Sedan/Sports Utility Vehicle explicitly excluded
          per student instruction (covered by Open Images already);
          Hatchback/Pickup Truck/Bicycle also excluded, extrapolated
          from the same reasoning but not explicitly confirmed by the
          student — flagged as such in DEC-083.
    secondary_role: diversity
    lowlight_augment:
      source: exdark
      native_class: "Car"
      guaranteed_floor: true
    cap: 4500

  motorcycle:
    id: 2
    # Split from the former combined "Two Wheeler" class per DEC-038
    # (2026-08-08) — motorcycle (fast, high kinetic risk) and bicycle
    # (slow, silent) have different enough hazard profiles to warrant
    # distinct TTS feedback. Was ID 2 as "Two Wheeler"; slot reused,
    # same pattern as DEC-015/DEC-021.
    primary:
      source: open_images
      native_class: "Motorcycle"
    secondary_providers:
      - source: roboflow
        project: "machine-exercise-5/me5-u6rvg"
        native_class_filter: "Motorcycle"
        role: diversity
        note: "Active as of 2026-08-08 (DEC-037). Benched 2026-08-21 (DEC-087) — see vehicle: block above for the full reasoning, same source."
      - source: roboflow
        project: "yoloffico/traffico-y1"
        native_class_filter: "Motorcycle"
        role: diversity
        note: >
          Added once traffico-y1's class list was resolved (DEC-032).
          Currently blocked (zero generated versions, forking declined)
          — see datasets.yaml. Not the active Motorcycle secondary
          right now; me5_u6rvg is.
      - source: roboflow
        project: "dlsud-vehicle-classification-thesis/dlsu-d-vehicle-type-detection"
        native_class_filter: "Motorcycle"
        role: diversity
        note: "Added 2026-08-20 (DEC-083) — see datasets.yaml for the full multi-class mapping (also contributes Tricycle and Vehicle)."
    lowlight_augment:
      source: exdark
      native_class: "Motorbike"
      guaranteed_floor: true
    cap: 4500

  bicycle:
    id: 15
    # New class per DEC-038 (2026-08-08), split out of "Two Wheeler."
    # No new acquisition work needed — both sources already label
    # Bicycle separately from Motorcycle/Motorbike.
    primary:
      source: open_images
      native_class: "Bicycle"
    lowlight_augment:
      source: exdark
      native_class: "Bicycle"
      guaranteed_floor: true
    cap: 4500

  pole:
    id: 3
    primary:
      source: open_images
      native_class: "Street light"
      note: >
        Switched from Roboflow (pole_detection_z76mb + utility_poles_44tzx)
        to Open Images 2026-08-20 (DEC-083) — student's call, both Roboflow
        pole sources were unreviewed and this project already had multiple
        real cases of Roboflow small-project label quality being
        unreliable (DEC-082). Open Images' "Street light" class has
        44,697 boxes / 11,226 images in the cached train split alone —
        gold-standard annotation quality, zero Roboflow dependency,
        conceptually the same "vertical street-level fixture" hazard Pole
        was always meant to cover.
    cap: 4500

  animals:
    id: 4
    primary:
      source: open_images
      native_class: ["Dog", "Cat"]
    lowlight_augment:
      source: exdark
      native_class: ["Dog", "Cat"]
      guaranteed_floor: true
    cap: 4500

  stairs:
    id: 5
    # stairs_lusiz + stairs_hsatv are `failed` pending possible relabel
    # — see DEC-031 and docs/preprocessing.md. stairs_i2yia +
    # escalator_stairs failed direct visual review 2026-08-20 (DEC-082)
    # — duplicate/near-duplicate images, boxes not on the annotated
    # object; stair_gaptw is the current active replacement.
    primary_providers:
      - source: roboflow
        project: "stairs-n9kkx/stairs-lusiz"
      - source: roboflow
        project: "abeera-munir-v9edc/stairs-hsatv"
      - source: roboflow
        project: "tom-lai-8bp7n/stairs-i2yia"
        note: "Failed direct visual review 2026-08-20 (DEC-082) — see datasets.yaml audit_note."
      - source: roboflow
        project: "escalatorstairsdetection/escalator-stairs"
        native_class_filter: "stairs"
        note: "Failed direct visual review 2026-08-20 (DEC-082) — see datasets.yaml audit_note."
      - source: roboflow
        project: "school-4awgw/stair-gaptw"
        note: "Added 2026-08-20 (DEC-082) — the current active Stairs source, replacing the two above."
    secondary_providers:
      - source: roboflow
        project: "thesis-test-dataset/revised-pedestrian-obstacle"
        native_class_filter: "stairs"
        role: volume_topup
        note: >
          Added 2026-08-20 (DEC-083) primarily as a Vehicle/Pedestrian
          Lane source — its "stairs" class is an incidental Stairs
          contribution.
    cap: 4500

  shelf:
    id: 6
    primary:
      source: open_images
      native_class: "Shelf"
      note: >
        Replaces Escalator 2026-08-20 (DEC-083) — escalator_stairs (the
        only Escalator source) failed direct visual review (DEC-082) and
        no replacement with adequate data could be found (public options
        surveyed clustered around ~500 images). Escalator's id-6 slot is
        reused rather than the schema renumbered to 15 classes, per the
        student's explicit "reserve first, only renumber if nothing
        suitable is found" call (DEC-082) — a suitable replacement was
        found, so renumbering was never needed. Shelf chosen over Cart
        (rejected — mostly horse-drawn carts on visual inspection, no
        clean way to filter to shopping carts) and Countertop (rejected
        — mostly residential kitchen countertops) after browsing all
        three in fiftyone_preview.ipynb's new ad-hoc candidate section.
        Open Images "Shelf": 22,899 boxes / 6,011 images in the cached
        train split — genuinely common mall/retail/grocery obstacle
        (aisle end-caps, protruding shelving) not covered by anything
        else in the schema.
    cap: 4500

  doors:
    id: 7
    primary_providers:
      - source: roboflow
        project: "testspace-xwkgk/cv-project-hovyc"
      - source: roboflow
        project: "nathaly-espinoza/door-detection-zqt59"
        native_class_filter: "door"
        note: "Added 2026-08-18 — second Doors source, addressing the post-eyecue bottleneck (DEC-069/DEC-071/DEC-073)."
    cap: 4500

  chairs:
    id: 8
    primary:
      source: open_images
      native_class: "Chair"
    lowlight_augment:
      source: exdark
      native_class: "Chair"
      guaranteed_floor: true
    cap: 4500

  tables:
    id: 9
    primary:
      source: open_images
      native_class: ["Table", "Coffee table"]
      note: >
        Coffee table added alongside Table per DEC-029 — mall/lounge
        deployment environments commonly feature coffee tables, not
        just dining tables.
    lowlight_augment:
      source: exdark
      native_class: "Table"
      guaranteed_floor: true
    cap: 4500

  tricycle:
    id: 10
    status: possible
    primary_providers:
      - source: roboflow
        project: "traffico-augmented/augmented-tricycle"
        note: "Benched 2026-08-21 (DEC-087) — never went through full fiftyone_review_processed.ipynb review (still `[x]`, unreviewed); student's call to drop it rather than review it."
      - source: roboflow
        project: "yoloffico/traffico-y1"
        native_class_filter: ["Tricycle", "tricycle"]
        role: volume_topup
        note: "Source has both case variants as separate labels (DEC-032) — both map here."
      - source: roboflow
        project: "roitrike/roitrikee"
        note: "Added 2026-08-20 (DEC-083) — second Tricycle-only source, since the existing pool was thin (~1,307 images)."
      - source: roboflow
        project: "dlsud-vehicle-classification-thesis/dlsu-d-vehicle-type-detection"
        native_class_filter: "Tricycle"
        role: volume_topup
        note: "Added 2026-08-20 (DEC-083) — see datasets.yaml for the full multi-class mapping (also contributes Motorcycle and Vehicle)."
    cap: 4500

  potholes:
    id: 11
    # Combined-source strategy per DEC-034: two co-primary "pure
    # pothole" sources, expected to stay under 3500 combined without
    # needing road-damage-detector's messier multi-class volume.
    # pothole_vhmow benched 2026-08-20 (DEC-083) in favor of
    # pothole_voxrl — see datasets.yaml.
    primary_providers:
      - source: dataset_ninja
        dataset_name: "pothole-detection"
        format: pascal_voc
        note: "Currently blocked — Dropbox link rate-limited 2026-08-08. Retry later."
      - source: roboflow
        project: "yeeun-kim-fyvoj/pothole-vhmow"
        note: "Benched 2026-08-20 (DEC-083) — replaced by pothole_voxrl below."
      - source: roboflow
        project: "brad-dwyer/pothole-voxrl"
        note: "Added 2026-08-20 (DEC-083) — the current active Roboflow Potholes source."
    secondary_providers:
      - source: dataset_ninja
        dataset_name: "road-damage-detector"
        native_class_filter: "pothole"
        role: volume_topup
        note: >
          Originally deprioritized (DEC-034) as a fallback-only source.
          Activated 2026-08-21 (DEC-086) — with pothole_vhmow benched
          (DEC-083), the combined primary volume alone (1,330 images)
          fell below the 1,500 floor; this source's real, already-
          converted 1,331 images close the gap.
      - source: roboflow
        project: "mahindra-university-ogyod/utility-poles-44tzx"
        role: diversity
        note: >
          Dual-purpose source, also contributes to Pole. Added
          2026-08-08, DEC-035. Benched 2026-08-20 (DEC-083) alongside
          its Pole role (Pole switched to Open Images) — its real
          Potholes contribution was already zero in the converted
          output before the bench, per DEC-083.
    cap: 4500

  trash_bins:
    id: 12
    primary:
      source: open_images
      native_class: "Waste container"
      # Verified 2026-08-08 (DEC-029) — exact match confirmed via
      # fiftyone.utils.openimages.get_classes().
    secondary_providers:
      - source: roboflow
        project: "TBD"
        audit_status: benched
        audit_note: >
          Benched 2026-08-08 (DEC-039) — Open Images primary judged
          sufficient for now rather than continuing to search for a
          project. Revisit only if post-acquisition evaluation shows
          the primary alone is insufficient in volume/diversity.
    secondary_role: diversity
    cap: 4500

  elevator:
    id: 13
    primary_providers:
      - source: roboflow
        project: "detection-3h20r/elevator-awvus"
      - source: roboflow
        project: "rightly-ai-huxry/elevator-status-s4lrk"
        audit_note: >
          Mini-audit 2026-08-08 (DEC-031): partially usable — has
          genuine detection-style samples (people in elevators with
          real boxes), not purely a scene classifier as first
          suspected. State-related labels collapse into a single
          "elevator" class. Same box-shape concern as Stairs. Full
          Stage 5.3 audit still needed to isolate the usable subset.
        note: >
          Failed direct visual review 2026-08-20 (DEC-082) — overturns
          the DEC-031 "genuine usable subset" framing above. Large
          corrupted black regions baked into the source images
          themselves. Replaced by elevator-status-0iq4p below.
      - source: roboflow
        project: "elevator-0iq4p/elevator-status"
        native_class_filter:
          elevator: ["Open Elevator", "Closed Elevator", "-Nobody was in the elevator"]
          person: "People are in the elevator."
        note: >
          Added 2026-08-20 (DEC-082) — a distinct Roboflow project
          from elevator-status-s4lrk (different workspace, verified
          not a duplicate/mirror). "People are in the elevator." is
          re-mapped to canonical Person, not Elevator, per explicit
          student instruction — geometrically verified post-conversion
          (tight, individual per-person boxes, not one elevator-shaped
          box). See datasets.yaml for the full audit_note.
    cap: 4500

  pedestrian_lane:
    id: 14
    primary_providers:
      - source: roboflow
        project: "anomaly-road-crossing-detection/pedestrian-and-animal-crossing"
        native_class_filter: "pedestrian_crossing"
        audit_note: >
          Multi-class source, also contains animal-crossing.
          Confirm exact class label after download.
        note: >
          Benched 2026-08-20 (DEC-083) — replaced by wtf_dwvgm below.
          (This project was separately forked into the student's own
          workspace as kenth/pedestrian-and-animal-crossing-vcjuo with
          a different native_class_filter — see datasets.yaml's
          `pedestrian_and_animal_crossing` entry, DEC-053. That forked
          entry is benched too, same DEC-083 change.)
      - source: roboflow
        project: "ajsh-yai1y/wtf-dwvgm"
        native_class_filter: ["crosswalk", "Crosswalks"]
        note: "Added 2026-08-20 (DEC-083) — 'Main Pedestrian Lane Dataset,' the current active primary source."
    secondary_providers:
      - source: roboflow
        project: "thesis-test-dataset/revised-pedestrian-obstacle"
        native_class_filter: "crosswalk"
        role: volume_topup
        note: "Added 2026-08-20 (DEC-083) — see datasets.yaml for the full multi-class mapping (also contributes Vehicle, Stairs, Person)."
    cap: 4500
